api:
    attempts: 5
    procCores: 8
    reserveduris: ['/authenticate','/register','/error','/logout','/validate','/validateResetPassword','/resetPassword','/forgotPassword']
    apiServer: 'http://localhost:8080'
    apichainLimit: 3
    postcrement: false
    iostateDir: '.boot/.iostate'
    serverType: master
    configType: large
    throttle:
        active: false
        rateLimit: {'ROLE_USER':1000}
        dataLimit: {'ROLE_USER':1000000}
        # 60000=10m
        staleSession: 60000
    webhook:
        active: false
    security:
        networkRoles: {'open':['ROLE_ADMIN','ROLE_ANONYMOUS','ROLE_USER'],'public':['ROLE_ADMIN','ROLE_USER'],'private':['ROLE_ADMIN']}
        corsWhiteList: ['http://localhost','http://localhost:80','http://127.0.0.1','http://test.nosegrind.net']
    mail:
        host: 'smtp.sendgrid.net'
        port: 587
        username: 'apikey'
        password: "your_token"
        fromAddress: 'nospam@yoursite.com'
        senderName: 'beapi.io'
        smtpAuth: true
        smtpStarttlsEnable: true
        testemail: 'youremail@yoursite.com'
    cookie:
        cookieName: "beapiSession"
        cookieMaxAge: -1
    bootstrap:
        superUser: {
            login: 'admin',
            password: 'password',
            email: 'email@yourdomain.com'
        }
        testUser: {
            login: 'test',
            password: 'password',
            email: 'test@yourdomain.com',
        }
    callback:
        validation: "/validate"
        forgotPassword: "http://localhost:80/reset_password.html"
        resetPassword: "http://localhost:80/reset_password.html"
